name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: catches breakage from new Composer or dependency releases.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
      # Runs both suites on the matrix PHP, not the runner's; xdebug provides the coverage driver.
      # The action forwards the job environment into its container, and Xdebug 3 only
      # collects coverage when XDEBUG_MODE says so.
      - uses: php-actions/phpunit@v4
        env:
          XDEBUG_MODE: coverage
        with:
          php_version: ${{ matrix.php }}
          php_extensions: xdebug
          configuration: phpunit.xml
          coverage_text: true
  lowest-composer:
    name: Composer 2.3 (lowest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # composer/composer 2.3.x carries security advisories and Composer >= 2.9
      # refuses to install advisory-flagged versions. The old Composer is the
      # thing under test here, so allow it for this job only.
      - run: composer config policy.advisories.ignore composer/composer
      - uses: php-actions/composer@v6
        with:
          php_version: '8.1'
          command: require
          args: composer/composer:2.3.* --dev
      - uses: php-actions/phpunit@v4
        with:
          php_version: '8.1'
          configuration: phpunit.xml
  windows:
    name: Windows (PHP 8.4)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # php-actions runs Linux containers only, so Windows gets a native PHP from setup-php.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --no-progress
      # Composer's bin proxies are PHP files, so this form works in PowerShell too.
      - run: php vendor/bin/phpunit
  # The two tool jobs run on the runner's own PHP, so vendor/ is resolved for the project's
  # minimum PHP: dependencies resolved for a newer PHP than the runner's can fail to parse.
  code-style:
    name: php-cs-fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: php-actions/composer@v6
        with:
          php_version: '8.1'
      - run: vendor/bin/php-cs-fixer fix src --dry-run --diff --config .php-cs-fixer.dist.php
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: php-actions/composer@v6
        with:
          php_version: '8.1'
      - run: vendor/bin/phpstan analyse --no-progress
